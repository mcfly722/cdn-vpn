---
- name: List endpoints for configured balancer
  ansible.builtin.command:
    argv:
      - gcloud
      - beta
      - compute
      - network-endpoint-groups
      - list-network-endpoints
      - "{{ balancer_item.key }}-neg"
      - "--project={{ project_id }}"
      - "--region={{ balancer_item.value.region }}"
      - --format=value(networkEndpoint.ipAddress,networkEndpoint.port)
  register: configured_neg_endpoints
  changed_when: false

- name: Identify NEG endpoints missing from inventory
  ansible.builtin.set_fact:
    stale_endpoint_lines: >-
      {{ configured_neg_endpoints.stdout_lines | reject('match', '^\\s*$') | reject('match', expected_endpoint_pattern) | list }}
  vars:
    expected_endpoint_pattern: "{{ '^' ~ (balancer_item.value.backend_ip | regex_escape) ~ '\\s+' ~ (balancer_item.value.backend_port | string) ~ '$' }}"

- name: Show stale NEG endpoint removal plan
  ansible.builtin.debug:
    msg: "Would remove endpoint {{ stale_endpoint }} from {{ balancer_item.key }}-neg."
  loop: "{{ stale_endpoint_lines }}"
  loop_control:
    loop_var: stale_endpoint
    label: "{{ stale_endpoint | trim }}"
  when: not (prune_confirmed | bool)

- name: Remove stale NEG endpoint
  ansible.builtin.command:
    argv:
      - gcloud
      - beta
      - compute
      - network-endpoint-groups
      - update
      - "{{ balancer_item.key }}-neg"
      - "--project={{ project_id }}"
      - "--region={{ balancer_item.value.region }}"
      - "--remove-endpoint=ip={{ stale_endpoint.split()[0] }},port={{ stale_endpoint.split()[1] }}"
  loop: "{{ stale_endpoint_lines }}"
  loop_control:
    loop_var: stale_endpoint
    label: "{{ stale_endpoint | trim }}"
  changed_when: true
  when: prune_confirmed | bool