---
- name: Ensure obsolete regional Cloud NAT is absent
  ansible.builtin.include_tasks: delete_if_exists.yml
  vars:
    cleanup_label: "Cloud NAT lb-nat ({{ prune_region }})"
    cleanup_describe:
      - gcloud
      - compute
      - routers
      - nats
      - describe
      - lb-nat
      - --router=lb-router
      - "--project={{ project_id }}"
      - "--region={{ prune_region }}"
    cleanup_delete:
      - gcloud
      - compute
      - routers
      - nats
      - delete
      - lb-nat
      - --router=lb-router
      - "--project={{ project_id }}"
      - "--region={{ prune_region }}"
      - --quiet

